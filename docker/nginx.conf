# ============================================================
# OrbitAPI gateway
# ============================================================
# One origin for everything. That single decision is what lets us ship ONE
# prebuilt image to every customer: the browser derives the API address from
# window.location.origin, so nothing about the customer's hostname has to be
# known at build time — and there is no CORS to configure.
#
#   /          → the Next.js app
#   /rest/v1/  → PostgREST   (what supabase-js calls for .from() queries)
#   /auth/v1/  → GoTrue      (what supabase-js calls for auth)
#
# HTTPS lives in a separate file that 20-orbit-tls.sh writes ONLY when
# certificates are present. nginx refuses to start if an ssl_certificate path
# doesn't exist, so a static TLS block here would make the whole gateway
# unbootable on an install that hasn't got certs yet.

# Docker's embedded DNS. Without an explicit resolver nginx resolves upstream
# names ONCE at startup and dies with "host not found in upstream" if a
# container is still coming up — and never retries. With it, plus the
# variables below, names are resolved per request, so the gateway survives any
# backend restarting.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# The app's in-memory rate limiter reads this to tell callers apart. Without
# it every request appears to come from the gateway and one busy user would
# throttle everyone.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  include /etc/nginx/conf.d/orbit-locations.inc;
}
