# ============================================================
# OrbitAPI gateway
# ============================================================
# One origin for everything. That single decision is what lets us ship ONE
# prebuilt image to every customer: the browser derives the API address from
# window.location.origin, so nothing about the customer's hostname has to be
# known at build time — and there is no CORS to configure.
#
#   /          → the Next.js app
#   /rest/v1/  → PostgREST   (what supabase-js calls for .from() queries)
#   /auth/v1/  → GoTrue      (what supabase-js calls for auth)

upstream orbit_app  { server orbit-app:3000; }
upstream orbit_rest { server orbit-rest:3000; }
upstream orbit_auth { server orbit-auth:9999; }

# Shared proxy behaviour.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# The app's in-memory rate limiter reads this to tell callers apart. Without
# it every request appears to come from the gateway and one busy user would
# throttle everyone.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Uncomment once certs are in ./certs to force HTTPS.
  # return 301 https://$host$request_uri;

  include /etc/nginx/conf.d/orbit-locations.inc;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Self-signed by the installer unless the operator drops in real certs.
  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;

  include /etc/nginx/conf.d/orbit-locations.inc;
}
