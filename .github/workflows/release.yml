name: Self-hosted release

# Builds the offline update bundle a self-hosted customer applies by hand.
#
# Triggered by a tag so releases are deliberate: `git tag selfhost-v1.2.3`.
# Continuous deployment is right for cloud and wrong here — an air-gapped
# customer schedules an upgrade, they don't receive one.

on:
  push:
    tags: ['selfhost-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, e.g. 1.2.3'
        required: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#selfhost-v}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$v' is not a semantic version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"

      - name: Install dependencies
        run: npm ci

      # The bundle is only worth building if the code is sound; a customer
      # cannot roll back easily once it's on their hardware.
      - name: Verify
        run: |
          npx tsc --noEmit
          npm run check:connectors
          npm run check:bundles
          npm run test:offline

      - name: Build the app image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg ORBIT_VERSION=${{ steps.v.outputs.version }} \
            -t orbitapi/app:${{ steps.v.outputs.version }} .

      - name: Pull the pinned upstream images
        run: |
          docker pull postgres:16-alpine
          docker pull supabase/gotrue:v2.177.0
          docker pull postgrest/postgrest:v12.2.3
          docker pull nginx:1.27-alpine

      - name: Write the signing key
        if: env.RELEASE_SIGNING_KEY != ''
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/release.pem

      - name: Build the bundle
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_SIGNING_KEY:-}" ]; then
            node scripts/build-release-bundle.mjs \
              --version ${{ steps.v.outputs.version }} \
              --sign /tmp/release.pem --kid ${{ vars.RELEASE_KID || 'r1' }}
          else
            # Unsigned bundles are refused by verify-bundle.mjs, so this can
            # never reach a customer — it just keeps the workflow runnable
            # before the signing key exists.
            echo "::warning title=Unsigned release::RELEASE_SIGNING_KEY is not set, so this bundle is UNSIGNED and customers cannot apply it."
            node scripts/build-release-bundle.mjs --version ${{ steps.v.outputs.version }}
          fi

      - name: Shred the signing key
        if: always()
        run: rm -f /tmp/release.pem

      - name: Verify the bundle we just built
        run: |
          set -euo pipefail
          cd dist
          if [ -n "${{ secrets.RELEASE_SIGNING_KEY }}" ]; then
            node ../scripts/verify-bundle.mjs orbit-selfhost-${{ steps.v.outputs.version }}.tar.gz
          else
            node ../scripts/verify-bundle.mjs orbit-selfhost-${{ steps.v.outputs.version }}.tar.gz --allow-unsigned
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-selfhost-${{ steps.v.outputs.version }}
          path: dist/orbit-selfhost-${{ steps.v.outputs.version }}.tar.gz
          retention-days: 90

      # An Actions artifact expires in 90 days and needs a GitHub login with
      # access to this repo — neither of which a paying customer has. Publishing
      # to Blob is what makes /settings/downloads a real page rather than a
      # promise the docs were already making.
      - name: Publish the bundle to Blob
        id: publish
        env:
          BLOB_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BLOB_TOKEN:-}" ]; then
            echo "::warning title=Not published::BLOB_READ_WRITE_TOKEN is unset, so this build is not downloadable by customers."
            exit 0
          fi

          VERSION=${{ steps.v.outputs.version }}
          FILE=dist/orbit-selfhost-$VERSION.tar.gz

          # Uploaded under a per-version path. The store returns a URL with a
          # random suffix, so the URL is unguessable and is never exposed in the
          # downloads catalogue — /api/downloads/[version] hands it out per
          # request, after checking entitlement.
          URL=$(npx --yes vercel@latest blob put "$FILE" \
                  --rw-token "$BLOB_TOKEN" \
                  --pathname "selfhost/$VERSION/orbit-selfhost-$VERSION.tar.gz" \
                | grep -Eo 'https://[^[:space:]]+' | head -1)

          if [ -z "$URL" ]; then
            echo "::error title=Upload failed::No blob URL came back; the release was NOT published to customers."
            exit 1
          fi

          {
            echo "url=$URL"
            echo "sha=$(sha256sum "$FILE" | cut -d' ' -f1)"
            echo "size=$(stat -c%s "$FILE")"
          } >> "$GITHUB_OUTPUT"

      # Catalogue it, so cutting a tag remains the ONE action that publishes a
      # release. Without this the bundle exists but no customer can see it.
      - name: Register the release
        if: ${{ steps.publish.outputs.url != '' }}
        env:
          REGISTRY_SECRET: ${{ secrets.RELEASE_REGISTRY_SECRET }}
          REGISTRY_URL: ${{ vars.RELEASE_REGISTRY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_SECRET:-}" ] || [ -z "${REGISTRY_URL:-}" ]; then
            echo "::warning title=Not catalogued::RELEASE_REGISTRY_SECRET or RELEASE_REGISTRY_URL is unset, so this build will not appear on the downloads page."
            exit 0
          fi

          # The changelog the bundle itself ships, so the page and the tarball
          # can never disagree about what changed.
          CHANGELOG=$(sed -n '1,40p' CHANGELOG.md 2>/dev/null || echo "")

          jq -n \
            --arg version "${{ steps.v.outputs.version }}" \
            --arg blobUrl "${{ steps.publish.outputs.url }}" \
            --arg sha256 "${{ steps.publish.outputs.sha }}" \
            --arg changelog "$CHANGELOG" \
            --argjson sizeBytes "${{ steps.publish.outputs.size }}" \
            '{version:$version, blobUrl:$blobUrl, sha256:$sha256, sizeBytes:$sizeBytes, changelog:$changelog}' \
          | curl -sS --fail-with-body -X POST "$REGISTRY_URL/api/selfhost/releases/register" \
              -H "content-type: application/json" \
              -H "x-release-secret: $REGISTRY_SECRET" \
              --data-binary @-
