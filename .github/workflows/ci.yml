name: CI

# Quality gate for the platform. Runs on every push and PR. Keeps the
# self-extending connector catalog and the bundle registry honest: type
# safety, no duplicate/broken connectors, complete simulation data, and
# valid bundles. None of these steps need secrets — they analyze code only.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Migrations replay cleanly from an empty database
        run: npm run check:migrations

      - name: Connector integrity (no dups, complete manifests, valid actions)
        run: npm run check:connectors

      - name: Bundle integrity (connectors/alternatives/groups/actions resolve)
        run: npm run check:bundles

      - name: Simulation data parity (every action has demo data)
        run: npm run test:sim-parity

      - name: Offline edition checks (provider, secrets, config, gating)
        run: npm run test:offline

      # Grep guards for the two rules that are invisible in a diff but break
      # the self-hosted build. Both were real design decisions, and both are
      # the kind that quietly erode when someone adds "just one more" call site.
      - name: Offline edition invariants
        run: |
          set -euo pipefail

          # Every LLM call must go through lib/ai-provider.ts. A stray
          # anthropic() would work perfectly on cloud and be unreachable on an
          # air-gapped box — the worst possible place to discover it.
          stray=$(grep -rn --include='*.ts' --include='*.tsx' \
            -e "anthropic(" -e "@ai-sdk/anthropic" \
            app lib connectors 2>/dev/null | grep -v '^lib/ai-provider.ts:' || true)
          if [ -n "$stray" ]; then
            echo "::error title=Anthropic used outside the provider factory::$stray"
            exit 1
          fi

          # NEXT_PUBLIC_APP_URL is inlined at build time, so one prebuilt
          # self-hosted image would carry whichever URL CI happened to have.
          # lib/app-url.ts is the only place allowed to read it.
          baked=$(grep -rn --include='*.ts' --include='*.tsx' \
            "process.env.NEXT_PUBLIC_APP_URL" app lib components 2>/dev/null \
            | grep -v '^lib/app-url.ts:' || true)
          if [ -n "$baked" ]; then
            echo "::error title=NEXT_PUBLIC_APP_URL read outside lib/app-url.ts::$baked"
            exit 1
          fi

          echo "Offline invariants hold."

  # ----------------------------------------------------------------------
  # Self-hosted stack smoke test.
  #
  # WHY THIS EXISTS: the offline edition is a second, permanent deployment
  # target that nobody exercises day to day. Every other check in this file
  # reads code; this one BUILDS the image, boots all five containers and
  # drives a real browser-shaped path through them — first-run wizard, sign-in
  # through the gateway, a simulated connector run with no AI configured.
  #
  # Without it, the offline build would only ever be tested on a customer's
  # air-gapped machine, which is the one place nobody can debug it.
  # ----------------------------------------------------------------------
  selfhost:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate an install config
        working-directory: docker
        run: node ../scripts/selfhost-gen-env.mjs --url http://localhost --out .env

      - name: Build the app image
        run: docker build -f docker/Dockerfile -t orbitapi/app:ci .

      - name: Start the stack
        working-directory: docker
        run: |
          set -euo pipefail
          sed -i 's|^ORBIT_IMAGE=.*|ORBIT_IMAGE=orbitapi/app:ci|' .env
          docker compose --env-file .env up -d
          docker compose --env-file .env ps

      - name: Smoke test
        working-directory: docker
        run: |
          set -euo pipefail
          # The smoke test needs the generated keys to call PostgREST and GoTrue
          # exactly as the browser does.
          set -a; . ./.env; set +a
          node ../scripts/selfhost-smoke.mjs --url http://localhost

      # Logs are the only way to diagnose a container that never became
      # healthy, and they vanish with the runner.
      - name: Container logs (on failure)
        if: failure()
        working-directory: docker
        run: |
          docker compose --env-file .env ps
          for s in orbit-app orbit-db orbit-auth orbit-rest orbit-gateway; do
            echo "::group::$s"
            docker compose --env-file .env logs --tail 200 "$s" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        working-directory: docker
        run: docker compose --env-file .env down -v || true

  # ----------------------------------------------------------------------
  # Deploy to production.
  #
  # WHY THIS EXISTS: Vercel's GitHub App silently stopped firing after
  # 2026-07-12 — commits kept landing on main, GitHub recorded no Deployment,
  # and nothing reached production for three weeks. Nobody noticed, because a
  # successful push looks identical whether or not a deploy followed it.
  #
  # This makes deploying something the repo owns rather than something an
  # external integration does invisibly, and gates it on `verify` above, so a
  # broken build can no longer reach production at all.
  #
  # It is a NO-OP until VERCEL_TOKEN is set as a repository secret, so it's
  # safe to merge before that exists — it skips with a warning instead of
  # failing red. If the Vercel GitHub App is later reconnected, the worst case
  # is one redundant build of the same commit, not a conflict.
  # ----------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::VERCEL_TOKEN secret is not set, so this commit was NOT deployed. Add it under Settings -> Secrets and variables -> Actions."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.has_token == 'true'
        with:
          node-version: '24'
          cache: 'npm'

      # Project and org IDs are identifiers, not secrets — they already live in
      # .vercel/project.json. Only the token needs protecting.
      - name: Deploy to Vercel (production)
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_gYYM4I8mrx6yAjmS336xLZOG
          VERCEL_PROJECT_ID: prj_bK79lToAxdxghDC9yLb97sSDC3w9
        run: |
          set -euo pipefail
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          {
            echo "### Deployed to production"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
